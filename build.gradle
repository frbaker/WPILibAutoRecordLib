plugins {
    id "cpp"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
    id "maven-publish"
}
group = 'com.team3267'
version = '1.1.2'

repositories {
    mavenCentral()
    maven{
        url "https://wpi.edu"
    }
}

model {
    components {
        autoRecordLib(NativeLibrarySpec) {
            sources.cpp {
                source {
                    srcDir 'src/main/native/cpp'
                    include '**/*.cpp'
                }

                exportedHeaders {
                    srcDir 'src/main/native/include'
                    include '**/*.h'
                }
            }

            // Build for RoboRIO and desktop/simulation
            targetPlatform wpi.platforms.roborio
            targetPlatform wpi.platforms.desktop

            // Link against WPILib
            wpi.cpp.deps.wpilib(it)
            wpi.cpp.vendor.cpp(it) //Includes vendor deps in this vendor dep
        }
    }
}


/*
 * ============================================================
 * Header ZIP
 * ============================================================
 */

tasks.register("cppHeadersZip", Zip) {
    archiveBaseName = "autoRecordLib"
    archiveVersion = project.version
    archiveClassifier = "headers"

    destinationDirectory = file("${buildDir}/distributions")

    from("src/main/native/include")
}


/*
 * ============================================================
 * RoboRIO shared library ZIPs
 * ============================================================
 *
 * GradleRIO expects these Maven artifacts:
 *
 *   autoRecordLib-1.0.0-linuxathena.zip
 *   autoRecordLib-1.0.0-linuxathenadebug.zip
 *
 * The native model produces the actual libraries under:
 *
 *   build/libs/autoRecordLib/shared/linuxathena/release/
 *   build/libs/autoRecordLib/shared/linuxathena/debug/
 *
 */


/*
 * RoboRIO Release
 */
tasks.register("cppLinuxathenaReleaseZip", Zip) {
    archiveBaseName = "autoRecordLib"
    archiveVersion = project.version
    archiveClassifier = "linuxathena"

    destinationDirectory = file("${buildDir}/distributions")

    dependsOn "autoRecordLibLinuxathenaReleaseSharedLibrary"

    from("${buildDir}/libs/autoRecordLib/shared/linuxathena/release")
}


/*
 * RoboRIO Debug
 */
tasks.register("cppLinuxathenaDebugZip", Zip) {
    archiveBaseName = "autoRecordLib"
    archiveVersion = project.version
    archiveClassifier = "linuxathenadebug"

    destinationDirectory = file("${buildDir}/distributions")

    dependsOn "autoRecordLibLinuxathenaDebugSharedLibrary"

    from("${buildDir}/libs/autoRecordLib/shared/linuxathena/debug")
}


/*
 * ============================================================
 * Maven Publishing
 * ============================================================
 */

publishing {
    publications {
        cpp(MavenPublication) {
            groupId = "com.team3267"
            artifactId = "autoRecordLib"
            version = project.version

            // Public C++ headers
            artifact tasks.named("cppHeadersZip")

            // RoboRIO shared library
            artifact tasks.named("cppLinuxathenaReleaseZip")

            // RoboRIO shared library - debug
            artifact tasks.named("cppLinuxathenaDebugZip")
        }
    }

    /*
     * Local Maven repository used by the publishing task.
     *
     * The contents of this directory can then be copied/pushed
     * to the "maven" branch of the GitHub repository.
     */
    repositories {
        maven {
            name = "localMaven"
            url = layout.buildDirectory.dir("outputs/maven")
        }
    }
}


/*
 * ============================================================
 * Publishing dependencies
 * ============================================================
 */

tasks.named("publishCppPublicationToLocalMavenRepository") {
    dependsOn(
        "cppHeadersZip",
        "cppLinuxathenaReleaseZip",
        "cppLinuxathenaDebugZip"
    )
}